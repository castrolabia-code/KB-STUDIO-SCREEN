[workspace]
resolver = "2"
members = ["crates/kb-geometry", "crates/kb-proto", "crates/kb-pairing", "crates/kb-transport", "crates/kb-probe-win", "crates/kb-session", "crates/kb-win", "crates/kb-engine", "crates/kb-android"]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "LicenseRef-CastroLabs-Proprietary"
authors = ["Castro Labs"]
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
thiserror = "2"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
subtle = "2.6"
spake2 = "0.4"
base64 = "0.22"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rcgen = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
