[package]
name = "kb-transport"
description = "Transporte KB STUDIO SCREEN: abstracción sobre flujos de bytes (LAN hoy, USB a futuro) e implementación QUIC/TLS 1.3 con autenticación mutua por huella fijada."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
quinn = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
thiserror = { workspace = true }
kb-proto = { path = "../kb-proto" }
kb-pairing = { path = "../kb-pairing" }

[dev-dependencies]
kb-geometry = { path = "../kb-geometry" }
