[package]
name = "kb-win"
description = "Plataforma Windows de KB STUDIO SCREEN: Desktop Duplication, Media Foundation H.264, SendInput, topología de monitores, DPAPI, rescate de ventanas."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
kb-geometry = { path = "../kb-geometry" }
kb-proto = { path = "../kb-proto" }
kb-session = { path = "../kb-session" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Gdi",
  "Win32_Devices_Display",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_System_Memory",
  "Win32_Security_Cryptography",
  "Win32_UI_Controls",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Enumeration_Pnp",
  "Win32_Devices_Properties",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_Security",
] }
