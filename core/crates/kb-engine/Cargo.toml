[package]
name = "kb-engine"
description = "kbss-engine: motor host de KB STUDIO SCREEN para Windows (consola, MVP Fase 1)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "kbss-engine"
path = "src/main.rs"

[dependencies]
kb-geometry = { path = "../kb-geometry" }
kb-proto = { path = "../kb-proto" }
kb-pairing = { path = "../kb-pairing" }
kb-transport = { path = "../kb-transport" }
kb-session = { path = "../kb-session" }
kb-win = { path = "../kb-win" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = "1"
rand = { workspace = true }
base64 = { workspace = true }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
mdns-sd = "0.13"
if-addrs = "0.13"
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Console", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
