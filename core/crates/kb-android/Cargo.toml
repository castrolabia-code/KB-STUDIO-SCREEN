[package]
name = "kb-android"
description = "libkbcore.so: núcleo Rust de KB STUDIO SCREEN para Android (JNI)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "kbcore"
crate-type = ["cdylib", "rlib"]

[dependencies]
kb-geometry = { path = "../kb-geometry" }
kb-proto = { path = "../kb-proto" }
kb-pairing = { path = "../kb-pairing" }
kb-transport = { path = "../kb-transport" }
kb-session = { path = "../kb-session" }
tokio = { workspace = true }
serde_json = "1"
base64 = { workspace = true }
jni = "0.21"
