name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Tests
        working-directory: core
        run: cargo test --all-targets
      - name: Clippy
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Tests (MSVC)
        working-directory: core
        run: cargo test --all-targets -- --test-threads=1
      - name: Clippy (MSVC)
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings
      - name: Real Windows capture + encode + input test (release, with H.264 dump)
        working-directory: core
        env:
          KBSS_DUMP_H264: "1"
        run: cargo test --release -p kb-win --test windows_real -- --nocapture --test-threads=1
      - name: Build release binaries
        working-directory: core
        run: cargo build --release --bins
      - name: Run probe on the CI Windows runner
        working-directory: core
        run: |
          ./target/release/kb-probe-win.exe --no-pause
      - name: Installer full cycle (install, run, uninstall) on real Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "C:\Program Files\Castro Labs\KB Studio Screen"
          Start-Process descargas\KBStudioScreen-Setup.exe -ArgumentList '/S' -Wait
          foreach ($f in 'kbss-engine.exe','kb-probe-win.exe','Manual de uso.txt','LICENCIAS.txt','Desinstalar.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "falta $f" }
          }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\KB Studio Screen\KB Studio Screen.lnk")) { throw "falta acceso en menú Inicio" }
          $rule = netsh advfirewall firewall show rule name="KB Studio Screen" verbose | Out-String
          Write-Host $rule
          if ($rule -notmatch '47800' -or $rule -match 'Public') { throw "regla de firewall incorrecta" }
          $reg = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\KBStudioScreen'
          Write-Host "Registrado: $($reg.DisplayName) $($reg.DisplayVersion) de $($reg.Publisher)"
          # Motor instalado: escucha QUIC y el panel rechaza accesos sin token.
          $env:KBSS_NO_BROWSER = '1'
          $p = Start-Process "$dir\kbss-engine.exe" -ArgumentList '--sin-navegador' -PassThru
          Start-Sleep -Seconds 6
          if (-not (Get-NetUDPEndpoint -LocalPort 47800 -ErrorAction SilentlyContinue)) { throw "el motor no escucha en UDP 47800" }
          try { Invoke-WebRequest http://127.0.0.1:47801/ -UseBasicParsing | Out-Null; throw "el panel respondió sin token" }
          catch { if ($_.Exception.Response.StatusCode.value__ -ne 403) { throw "esperaba 403: $_" } }
          Write-Host "Motor instalado OK: UDP 47800 abierto; panel 127.0.0.1:47801 rechaza sin token (403)."
          Stop-Process -Id $p.Id -Force
          Start-Process "$dir\Desinstalar.exe" -ArgumentList '/S', "_?=$dir" -Wait
          Remove-Item "$dir\Desinstalar.exe" -ErrorAction SilentlyContinue
          if (Test-Path "$dir\kbss-engine.exe") { throw "la desinstalación dejó archivos" }
          $rule2 = netsh advfirewall firewall show rule name="KB Studio Screen" | Out-String
          if ($rule2 -match '47800') { throw "la desinstalación dejó la regla de firewall" }
          if (Test-Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\KBStudioScreen') { throw "quedó la entrada de desinstalación" }
          Write-Host "INSTALADOR OK: instalación, ejecución y desinstalación limpias."
          # netsh devuelve 1 al no encontrar la regla (lo esperado tras desinstalar).
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            core/target/release/*.exe
            core/kbss-probe-report.json

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          cargo install cargo-ndk --locked
      - name: Build APK (debug + release signed with test key)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: kb-studio-screen-apk
          path: android/app/build/outputs/apk/**/*.apk

  driver:
    # Compila el driver IddCx con el WDK de NuGet, lo firma con un certificado de
    # PRUEBA efímero y lo instala en el runner (que tiene "Test Mode" activo) para
    # verificar que Windows reconoce, captura y retira los monitores virtuales.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Restore WDK/SDK (NuGet)
        working-directory: driver/kbss-idd
        run: nuget restore packages.config -PackagesDirectory packages
      - name: Build driver
        working-directory: driver/kbss-idd
        run: msbuild kbss_idd.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:minimal
      - name: ApiValidator (driver universal)
        shell: pwsh
        working-directory: driver/kbss-idd
        run: |
          $wdk = (Get-ChildItem -Directory packages -Filter 'Microsoft.Windows.WDK.x64.*').FullName
          $av = Get-ChildItem -Recurse -Filter apivalidator.exe -Path "$wdk\c\bin" | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          $ddis = Get-ChildItem -Recurse -Filter UniversalDDIs.xml -Path "$wdk\c\build" | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          $wl = Get-ChildItem -Recurse -Filter ModuleWhiteList.xml -Path "$wdk\c\build" | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          $dll = (Get-ChildItem -Recurse -Filter kbss_idd.dll -Path x64 | Select-Object -First 1).FullName
          & $av.FullName "-DriverPackagePath:$dll" "-SupportedApiXmlFiles:$($ddis.FullName)" "-ModuleWhiteListXmlFiles:$($wl.FullName)"
          if ($LASTEXITCODE) { throw "ApiValidator: el driver usa APIs no universales" }
      - name: Test-sign and install driver
        shell: pwsh
        working-directory: driver/kbss-idd
        run: |
          $ErrorActionPreference = 'Stop'
          bcdedit /enum '{current}' | Select-String -Pattern 'testsigning'
          $pkg = Get-ChildItem -Recurse -Filter kbss_idd.inf -Path x64 | Select-Object -First 1
          $dir = $pkg.DirectoryName
          Write-Host "Paquete: $dir"; Get-ChildItem $dir
          $inf2cat = Get-ChildItem -Recurse -Filter Inf2Cat.exe -Path packages | Where-Object { $_.FullName -match 'x86|x64' } | Select-Object -First 1
          $signtool = Get-ChildItem -Recurse -Filter signtool.exe -Path packages, "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not (Test-Path "$dir\kbss_idd.cat")) { & $inf2cat.FullName /driver:$dir /os:10_X64 /uselocaltime; if ($LASTEXITCODE) { throw "Inf2Cat" } }
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=KBSS CI Test (efimero)' -CertStoreLocation Cert:\LocalMachine\My -NotAfter (Get-Date).AddDays(1)
          foreach ($store in 'Root', 'TrustedPublisher') {
            $s = New-Object System.Security.Cryptography.X509Certificates.X509Store($store, 'LocalMachine'); $s.Open('ReadWrite'); $s.Add($cert); $s.Close()
          }
          & $signtool.FullName sign /fd sha256 /sm /s My /sha1 $cert.Thumbprint "$dir\kbss_idd.dll"; if ($LASTEXITCODE) { throw "sign dll" }
          if (Test-Path "$dir\kbss_idd.cat") { Remove-Item "$dir\kbss_idd.cat" }
          & $inf2cat.FullName /driver:$dir /os:10_X64 /uselocaltime; if ($LASTEXITCODE) { throw "Inf2Cat" }
          & $signtool.FullName sign /fd sha256 /sm /s My /sha1 $cert.Thumbprint "$dir\kbss_idd.cat"; if ($LASTEXITCODE) { throw "sign cat" }
          pnputil /add-driver "$dir\kbss_idd.inf" /install
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 3010) { throw "pnputil $LASTEXITCODE" }
          New-Item -ItemType Directory -Force ../../dist-driver | Out-Null
          Copy-Item "$dir\*" ../../dist-driver/
      - name: Create virtual adapter (installer step, admin)
        working-directory: core
        run: |
          cargo build --release -p kb-engine
          ./target/release/kbss-engine.exe driver create-adapter
          Start-Sleep -Seconds 5
          pnputil /enum-devices /class Display
      - name: Real virtual monitor test (as the engine would, via IOCTL)
        working-directory: core
        env:
          KBSS_IDD_TEST: "1"
        run: cargo test --release -p kb-win --test idd_real -- --nocapture --test-threads=1
      - name: Remove adapter and driver (clean uninstall)
        if: always()
        working-directory: core
        shell: pwsh
        run: |
          ./target/release/kbss-engine.exe driver remove-adapter
          pnputil /enum-drivers | Select-String -Context 0,6 'kbss_idd' 
          $oem = (pnputil /enum-drivers | Select-String -Context 1,0 'kbss_idd.inf' | ForEach-Object { ($_.Context.PreContext[0] -split ':\s+')[1] }) | Select-Object -First 1
          if ($oem) { pnputil /delete-driver $oem /uninstall /force }
          pnputil /enum-devices /class Display
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kbss-idd-driver-test-signed
          path: dist-driver/

  android-e2e:
    # La app REAL en un emulador Android 10 (API 29, mínimo soportado) contra el
    # host de demostración: JNI + QUIC + emparejamiento QR + MediaCodec + toques.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          cargo install cargo-ndk --locked
      - name: Build APKs (app + instrumented tests)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Start demo host
        run: |
          cargo build --release -p kb-session --example demo_host --manifest-path core/Cargo.toml
          nohup ./core/target/release/examples/demo_host core/crates/kb-session/examples/testdata/testsrc_720p.h264 47800 10.0.2.2 qr.txt core/crates/kb-session/examples/testdata/letra_prueba.pdf > demo.log 2>&1 &
          sleep 2
          base64 -w0 qr.txt > qr.b64
      - name: Run on Android 10 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            cd android && ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.kbssQrB64=$(cat ../qr.b64)
            cd android && ./gradlew --no-daemon -q installDebug && adb shell am start -n com.castrolabs.kbstudioscreen/.MainActivity && sleep 8 && adb exec-out screencap -p > ../home.png && echo SCREEN_BEGIN && base64 -w 4000 ../home.png && echo SCREEN_END
      - name: Verify host received the touches
        if: always()
        run: |
          cat demo.log
          grep -q "APROBADO" demo.log
          grep -q "INJECT Button" demo.log
          grep -q "DOC enviado" demo.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-e2e-report
          path: |
            android/app/build/reports/androidTests/
            demo.log
