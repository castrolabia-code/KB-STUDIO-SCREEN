name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Tests
        working-directory: core
        run: cargo test --all-targets
      - name: Clippy
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Tests (MSVC)
        working-directory: core
        run: cargo test --all-targets -- --test-threads=1
      - name: Clippy (MSVC)
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings
      - name: Real Windows capture + encode + input test (release, with H.264 dump)
        working-directory: core
        env:
          KBSS_DUMP_H264: "1"
        run: cargo test --release -p kb-win --test windows_real -- --nocapture --test-threads=1
      - name: Build release binaries
        working-directory: core
        run: cargo build --release --bins
      - name: Run probe on the CI Windows runner
        working-directory: core
        run: |
          ./target/release/kb-probe-win.exe --no-pause
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            core/target/release/*.exe
            core/kbss-probe-report.json

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          cargo install cargo-ndk --locked
      - name: Build APK (debug + release signed with test key)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: kb-studio-screen-apk
          path: android/app/build/outputs/apk/**/*.apk
